name: snowflake_architect_fk
version: 1.0.0
config-version: 2
profile: snowflake_architect_fk

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  snowflake_architect_fk:
    # Folders ≠ Snowflake schemas. Medallion floors live in Snowflake schemas below.
    staging:
      +schema: SILVER_CURATED
      +materialized: view
    silver:
      +schema: SILVER_CURATED
      +materialized: table
    marts:
      # Gold board marts → GOLD_MART. Lab 02 fact overrides schema in its model config.
      +schema: GOLD_MART
      +materialized: table
