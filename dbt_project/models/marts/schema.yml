version: 2

models:
  - name: fct_orders_incremental
    description: "Incremental order fact (Lab 02) — lands in SILVER_CURATED via model schema override"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: updated_at
        tests:
          - not_null

  - name: gold_client_summary
    description: "Medallion gold — client LTV / counts for Alex (GOLD_MART)"
    columns:
      - name: client_id
        tests: [unique, not_null]
      - name: lifetime_value
        tests: [not_null]
